databases:
  - name: fairshare-db
    databaseName: fairshare_db
    user: fairshare_user
    plan: free

services:
  - type: web
    name: spliz-app
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: fairshare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fairshare-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fairshare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fairshare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fairshare-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: fairshare-db
          property: connectionString
